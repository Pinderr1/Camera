substitutions:
  device_name: senior-bed-presence
  friendly_name: Senior Bed Presence

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:
api:
ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

sensor:
  - platform: hx711
    name: Bed Load Raw
    id: bed_load_raw
    dout_pin: GPIO18
    clk_pin: GPIO19
    gain: 128
    update_interval: 1s
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2

binary_sensor:
  - platform: template
    name: Bed Occupied
    id: bed_occupied
    device_class: occupancy
    lambda: |-
      // Calibrate this threshold during observation-only mode.
      return id(bed_load_raw).state > 10000;
    filters:
      - delayed_on: 2s
      - delayed_off: 5s
