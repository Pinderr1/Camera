substitutions:
  device_name: senior-route-mmwave
  friendly_name: Senior Route mmWave

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev

logger:
api:
ota:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

uart:
  tx_pin: GPIO17
  rx_pin: GPIO16
  baud_rate: 256000
  parity: NONE
  stop_bits: 1

ld2410:

binary_sensor:
  - platform: ld2410
    has_target:
      name: Route Presence
    has_moving_target:
      name: Route Moving Target
    has_still_target:
      name: Route Still Target

sensor:
  - platform: ld2410
    moving_distance:
      name: Route Moving Distance
    still_distance:
      name: Route Still Distance
    moving_energy:
      name: Route Moving Energy
    still_energy:
      name: Route Still Energy
    detection_distance:
      name: Route Detection Distance
